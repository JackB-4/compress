plugins { id 'com.android.application' }
android {
 namespace 'com.jack.compress'
 compileSdk 35
 defaultConfig { applicationId 'com.jack.compress'; minSdk 29; targetSdk 35; versionCode 2; versionName '1.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildTypes { release { signingConfig signingConfigs.debug; debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'junit:junit:4.13.2'
 implementation 'androidx.media3:media3-transformer:1.8.0'
 implementation 'androidx.media3:media3-effect:1.8.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
